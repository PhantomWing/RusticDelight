# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21
parchment_mappings_version=2024.07.28

# Minecraft
minecraft_version=1.21
minecraft_version_range=[1.21,1.21.2)
neo_version=21.1.219
neo_version_range=[21.1.219,)
loader_version_range=[4,)

## Mod info
mod_version=1.7.1
mod_id=rusticdelight
mod_group_id=com.phantomwing.rusticdelight
mod_license=All Rights Reserved
mod_name=Rustic Delight
mod_description=A rustic add-on for Farmer's Delight that adds Pancakes, Cotton, Coffee, Bell Peppers, fried foods and more!
mod_authors=PhantomWing

# Main dependencies
farmersdelight_version=1.21.1-1.3.1
farmersdelight_version_range=[1.3.1,)

# Other dependencies
appleskin_version=mc1.21-3.0.4
include_appleskin=true

jei_version=19.5.0.31

thirst_version=1.21.1-2.1.5
include_thirst=true

# Brewin' and Chewin' (Modrinth version id for v4.4.1, NeoForge 1.21.1) - dev runtime only, for testing coasters
brewinandchewin_version=1OnUtwc4
include_brewinandchewin=true

# --- Publishing (Modrinth + CurseForge via mod-publish-plugin) ---
# Project IDs are PUBLIC. Tokens are SECRET — set MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars,
# or modrinth_token / curseforge_token in ~/.gradle/gradle.properties (never commit them).
#   ./gradlew publishMods                 (publishes the NeoForge jar to both sites)
#   ./gradlew publishMods -PpublishDryRun  (stage to build/, upload nothing)
modrinth_project_id=foa4fGIH
curseforge_project_id=1106612
# Space-separated game versions tagged on each upload.
supported_minecraft_versions=1.21 1.21.1