# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# FDR 2.5.5 ships as a static-remap jar built with Loom 1.16.3, which Loom 1.8 refuses on version
# alone. It only uses a plain accesswidener (no classtweaker), so skipping the check is safe here.
loom.ignoreDependencyLoomVersionValidation=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.3

# Mod Properties
mod_version=1.7.0
mod_name=Rustic Delight
maven_group=com.phantomwing.rusticdelight
archives_base_name=rusticdelight

# --- Publishing (Modrinth + CurseForge via mod-publish-plugin) ---
# Tokens live in ~/.gradle/gradle.properties as modrinth_token / curseforge_token
# (or the MODRINTH_TOKEN / CURSEFORGE_TOKEN environment variables).
#   ./gradlew publishMods                  (publishes the Fabric jar to both sites)
#   ./gradlew publishMods -PpublishDryRun  (stage to build/, upload nothing)
# Same projects as the other branches - one mod page per site, one file per version.
modrinth_project_id = foa4fGIH
curseforge_project_id = 1106612
supported_minecraft_versions = 1.20.1

# Dependencies
fabric_version=0.92.11+1.20.1
farmersdelight_version=1.20.1-2.5.5
port_lib_version = 2.3.4+1.20.1
port_lib_modules = accessors,base,networking,tags,config,tool_actions,loot,lazy_registration,recipe_book_categories
fabric_asm_version = v2.3
jei_version = 15.49.0.188
cloth_config_version = 11.1.118
mixin_extras_version = 0.2.2
