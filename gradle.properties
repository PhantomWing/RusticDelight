# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Minecraft
# minecraft_version: local compile target (latest patch).
# minecraft_min_version drives the declared mod compat range and the FDR/AppleSkin coords
# (those mods publish against the base version only).
minecraft_version = 26.2
minecraft_min_version = 26.2
minecraft_max_version = 26.2

# Fabric
fabric_loader_version = 0.19.3
fabric_api_version = 0.152.2+26.2

# Mod
mod_id = rusticdelight
mod_version = 1.7.0
mod_group_id = com.phantomwing.rusticdelight

# Dependencies
appleskin_version = 3.0.10
farmersdelight_version = 3.6.6
cloth_config_version = 26.2.155
# JEI publishes per-patch artifacts (jei-26.2.X-fabric); pin the patch version here.
jei_minecraft_version = 26.2
jei_version = 30.0.0.5
# REI: no 26.2 build yet, placeholder pinned at last 1.21.11 release
rei_version = 21.11.814+fabric
# Game versions to tag on Modrinth/CurseForge uploads (space or comma separated).
