plugins {
	id 'fabric-loom' version '1.16-SNAPSHOT'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.0.0'
}

version = project.mod_version
group = project.mod_group_id

tasks.withType(Copy).configureEach {
	// Only override during runData execution
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

base {
	archivesName = "${project.mod_id}-fabric-${project.minecraft_version}"
}

loom {
	accessWidenerPath = file("src/main/resources/rusticdelight.accesswidener")
}

repositories {
	mavenLocal()

	maven {
		// Farmer's Delight Refabricated (repo.greenhouse.house moved here)
		name = "Greenhouse Maven"
		url = 'https://maven.greenhouse.lgbt/releases/'
	}

	maven {
		// Greenhouse has no 3.6.x build for 1.21.11 yet (newest there is 3.4.9), so FDR comes
		// from Modrinth instead. Swap back once Greenhouse catches up.
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}

	maven { // Fabric ASM
		url = "https://jitpack.io/"
	}

	maven {
		// CraftTweaker, JEI
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
	}
	maven { url "https://maven.ryanliptak.com/" } // AppleSkin
	maven { url = "https://maven.shedaniel.me/" } // REI and deps

	maven { url 'https://www.cursemaven.com' }
	maven { url = "https://maven.parchmentmc.org" }
}

fabricApi {
	configureDataGeneration() {
		client = true
		// Restrict datagen to our mod so transitive mods (FDR, etc.) don't overwrite shared-namespace
		// output files like data/minecraft/tags/villager_trade/farmer/level_1.json.
		modId = mod_id
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${minecraft_version}"

	// Fabric
	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}+${minecraft_version}"

	// Parchment mappings
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
	}

	// Farmer's Delight Refabricated
	modImplementation("maven.modrinth:farmers-delight-refabricated:${minecraft_version}-${farmersdelight_version}") {
		exclude(group: "net.fabricmc")
	}

	// Cloth Config API
	modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// JEI
	//modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
	//modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")

	// Appleskin
	modLocalRuntime("squeek.appleskin:appleskin-fabric:mc${minecraft_version}-${appleskin_version}")
}

processResources {
	var replaceProperties = [
			minecraft_version    : minecraft_version,
			minecraft_min_version: minecraft_min_version,
			minecraft_max_version: minecraft_max_version,

			mod_id               : mod_id,
			mod_version          : version,
			fabric_loader_version: fabric_loader_version,
			fabric_api_version   : fabric_api_version
	]

	inputs.properties replaceProperties

	filesMatching("fabric.mod.json") {
		expand replaceProperties + [project: project]
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.mod_id
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Pulls the body of the topmost "# <version>" section out of changelog.md.
ext.latestChangelog = {
	def f = file('changelog.md')
	if (!f.exists()) return "See changelog.md"
	def body = new StringBuilder()
	boolean started = false, done = false
	f.eachLine { line ->
		if (done) return
		if (line.startsWith('# ')) {
			if (started) { done = true; return }
			started = true
			return
		}
		if (started) body.append(line).append('\n')
	}
	def out = body.toString().trim()
	return out.isEmpty() ? "See changelog.md" : out
}

// Modrinth / CurseForge publishing. Dry run (no upload): ./gradlew publishMods -PpublishDryRun
// A real upload needs modrinth_token / curseforge_token in ~/.gradle/gradle.properties (or the
// MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars).
publishMods {
	// 1.21.11 is still obfuscated, so remapJar - not jar - produces the final mod artifact.
	file = tasks.named("remapJar", net.fabricmc.loom.task.RemapJarTask).flatMap { it.archiveFile }
	version = project.mod_version
	displayName = "Rustic Delight ${project.mod_version}"
	changelog = project.ext.latestChangelog()
	type = STABLE
	modLoaders.add("fabric")
	// -PpublishDryRun => stage to build/ without uploading.
	dryRun = project.hasProperty("publishDryRun")

	modrinth {
		projectId = providers.gradleProperty("modrinth_project_id")
		accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
		// Tag every supported game version on the upload, not just the build target.
		supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
		requires("fabric-api")
		requires("cloth-config")
		requires("farmers-delight-refabricated")
	}
	curseforge {
		projectId = providers.gradleProperty("curseforge_project_id")
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
		supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
		// CurseForge requires explicit side flags (Modrinth infers them from the jar).
		client = true
		server = true
		requires("fabric-api")
		requires("cloth-config")
		requires("farmers-delight-refabricated")
	}
}