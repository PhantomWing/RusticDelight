plugins {
	id 'fabric-loom' version '1.8-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

loom {
	accessWidenerPath = file("src/main/resources/rusticdelight.accesswidener")
}

repositories {
	// Farmer's Delight Refabricated (Modrinth Maven — Greenhouse mirror unreliable)
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}

	// Porting Lib
	maven { url "https://mvn.devos.one/releases/" }
	maven {
		url "https://maven.jamieswhiteshirt.com/libs-release"
		content {
			includeGroup "com.jamieswhiteshirt"
		}
	}
	maven {
		url "https://jitpack.io/"
		content {
			excludeGroup "io.github.fabricators_of_create"
		}
	}

	// JEI
	maven {
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
	}

	// Cloth Config, Appleskin
	maven {
		name = "CurseMaven"
		url = "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}

	// Cloth Config (Shedaniel)
	maven {
		name = "Shedaniel Maven"
		url = "https://maven.shedaniel.me/"
	}
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Fabric
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Farmer's Delight Refabricated
	modImplementation("maven.modrinth:farmers-delight-refabricated:${project.farmersdelight_version}") {
		exclude(group: "net.fabricmc")
	}

	// Porting Lib
	for (String module in port_lib_modules.split(",")) {
		modApi("io.github.fabricators_of_create.Porting-Lib:$module:$port_lib_version")
	}

	// Fabric ASM (provides com.chocohead.mm.api.ClassTinkerers, required at runtime by Porting Lib)
	modImplementation("com.github.Chocohead:Fabric-ASM:${fabric_asm_version}")

	// Cloth Config API
	modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// JEI
	modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

	// Appleskin
	modLocalRuntime "curse.maven:appleskin-248787:4770825"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}