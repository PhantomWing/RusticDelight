plugins {
	id 'fabric-loom' version '1.17.0-alpha.7'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.0.0'
}

version = project.mod_version
group = project.maven_group

// Per-release changelog: notes under the first "# X.Y.Z" header in changelog.md, up to the next "# ".
ext.latestChangelog = {
	def f = file('changelog.md')
	if (!f.exists()) return "See changelog.md"
	def body = new StringBuilder()
	boolean started = false, done = false
	f.eachLine { line ->
		if (done) return
		if (line.startsWith('# ')) {
			if (started) { done = true; return }
			started = true
			return
		}
		if (started) body.append(line).append('\n')
	}
	def out = body.toString().trim()
	return out.isEmpty() ? "See changelog.md" : out
}

tasks.withType(Copy).configureEach {
	// Only override during runData execution
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

loom {
	accessWidenerPath = file("src/main/resources/rusticdelight.accesswidener")
}

repositories {
	mavenLocal()

	flatDir {
		dirs 'libs'
	}

	maven {
		// Farmer's Delight Refabricated (Modrinth Maven)
		url = "https://api.modrinth.com/maven"
	}

	maven { // Fabric ASM
		url = "https://jitpack.io/"
	}

	maven {
		// CraftTweaker, JEI
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
	}
	maven { url "https://maven.ryanliptak.com/" } // AppleSkin
	maven { url = "https://maven.shedaniel.me/" } // REI and deps

	maven { url 'https://www.cursemaven.com' }
	maven { url = "https://maven.parchmentmc.org" }
}

fabricApi {
	configureDataGeneration {
		modId = "rusticdelight"
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Fabric
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Parchment mappings
	mappings loom.layered() {
		it.officialMojangMappings {
			setNameSyntheticMembers(false)
		}
		it.parchment("org.parchmentmc.data:parchment-${project.parchment_version}")
	}

	// Farmer's Delight Refabricated (local patched jar — strips the 5 transitive-extend-enum lines
	// from farmersdelight.classtweaker, which still crash loom's remap with an NPE in
	// EnumExtensionClassVisitor. Re-checked against 3.3.3: the upstream issue is not fixed.)
	modImplementation(name: "farmers-delight-refabricated-${project.minecraft_version}-${project.farmersdelight_version}-patched") {
		exclude(group: "net.fabricmc")
	}

	// Cloth Config API
	modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// JEI API
	modCompileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}")
	modCompileOnly("mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}")

	// JEI
	modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}")

	// Appleskin
	modLocalRuntime("squeek.appleskin:appleskin-fabric:${appleskin_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// --- Modrinth + CurseForge release (Fabric jar) ---
// ./gradlew publishMods                  (needs MODRINTH_TOKEN / CURSEFORGE_TOKEN; see gradle.properties)
// ./gradlew publishMods -PpublishDryRun  (stage to build/, upload nothing)
publishMods {
	// remapJar, not jar: the plain jar still carries named mappings and will not run in production.
	file = remapJar.archiveFile
	version = mod_version
	displayName = "${mod_name} ${mod_version}"
	changelog = latestChangelog()
	type = STABLE
	modLoaders.add("fabric")
	dryRun = project.hasProperty("publishDryRun")

	modrinth {
		projectId = providers.gradleProperty("modrinth_project_id")
		accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
		supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
		// Fabric needs all three; the NeoForge build only depends on Farmer's Delight.
		requires("fabric-api")
		requires("farmers-delight-refabricated")
		requires("cloth-config")
	}
	curseforge {
		projectId = providers.gradleProperty("curseforge_project_id")
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
		supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
		// CurseForge needs explicit side flags (Modrinth infers them from the jar).
		client = true
		server = true
		requires("fabric-api")
		requires("farmers-delight-refabricated")
		requires("cloth-config")
	}
}