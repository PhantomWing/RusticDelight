plugins {
	// architectury-loom is a drop-in fabric-loom fork; used here only because it honours
	// loom.ignoreDependencyLoomVersionValidation, which upstream fabric-loom does not expose.
	id 'dev.architectury.loom' version '1.10.455'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.0.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

loom {
	accessWidenerPath = file("src/main/resources/rusticdelight.accesswidener")
}

repositories {
	// Farmer's Delight Refabricated (Modrinth Maven — Greenhouse mirror unreliable)
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}

	// Porting Lib
	maven { url "https://mvn.devos.one/releases/" }
	maven {
		url "https://maven.jamieswhiteshirt.com/libs-release"
		content {
			includeGroup "com.jamieswhiteshirt"
		}
	}
	maven {
		url "https://jitpack.io/"
		content {
			excludeGroup "io.github.fabricators_of_create"
		}
	}

	// JEI
	maven {
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
	}

	// Cloth Config, Appleskin
	maven {
		name = "CurseMaven"
		url = "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}

	// Cloth Config (Shedaniel)
	maven {
		name = "Shedaniel Maven"
		url = "https://maven.shedaniel.me/"
	}
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Fabric
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Farmer's Delight Refabricated
	modImplementation("maven.modrinth:farmers-delight-refabricated:${project.farmersdelight_version}") {
		exclude(group: "net.fabricmc")
	}

	// Porting Lib
	for (String module in port_lib_modules.split(",")) {
		modApi("io.github.fabricators_of_create.Porting-Lib:$module:$port_lib_version")
	}

	// Fabric ASM (provides com.chocohead.mm.api.ClassTinkerers, required at runtime by Porting Lib)
	modImplementation("com.github.Chocohead:Fabric-ASM:${fabric_asm_version}")

	// Cloth Config API
	modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// JEI
	modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

	// Appleskin
	modLocalRuntime "curse.maven:appleskin-248787:4770825"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Per-release changelog: notes under the first "# X.Y.Z" header in changelog.md, up to the next "# ".
ext.latestChangelog = {
	def f = file('changelog.md')
	if (!f.exists()) return "See changelog.md"
	def body = new StringBuilder()
	boolean started = false, done = false
	f.eachLine { line ->
		if (done) return
		if (line.startsWith('# ')) {
			if (started) { done = true; return }
			started = true
			return
		}
		if (started) body.append(line).append('\n')
	}
	def out = body.toString().trim()
	return out.isEmpty() ? "See changelog.md" : out
}

// --- Modrinth + CurseForge release (Fabric jar) ---
// ./gradlew publishMods                  (needs modrinth_token / curseforge_token in ~/.gradle/gradle.properties)
// ./gradlew publishMods -PpublishDryRun  (stage to build/, upload nothing)
publishMods {
	// remapJar, not jar: the plain jar still carries named mappings and will not run in production.
	file = remapJar.archiveFile
	version = mod_version
	displayName = "${mod_name} ${mod_version}"
	changelog = latestChangelog()
	type = STABLE
	modLoaders.add("fabric")
	dryRun = project.hasProperty("publishDryRun")

	modrinth {
		projectId = providers.gradleProperty("modrinth_project_id")
		accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
		supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
		requires("fabric-api")
		requires("farmers-delight-refabricated")
		requires("cloth-config")
	}
	curseforge {
		projectId = providers.gradleProperty("curseforge_project_id")
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
		supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
		// CurseForge needs explicit side flags (Modrinth infers them from the jar).
		client = true
		server = true
		requires("fabric-api")
		requires("farmers-delight-refabricated")
		requires("cloth-config")
	}
}