plugins {
	id 'fabric-loom' version '1.17.0-alpha.7'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

tasks.withType(Copy).configureEach {
	// Only override during runData execution
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

loom {
	accessWidenerPath = file("src/main/resources/rusticdelight.accesswidener")
}

repositories {
	mavenLocal()

	flatDir {
		dirs 'libs'
	}

	maven {
		// Farmer's Delight Refabricated (Modrinth Maven)
		url = "https://api.modrinth.com/maven"
	}

	maven { // Fabric ASM
		url = "https://jitpack.io/"
	}

	maven {
		// CraftTweaker, JEI
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
	}
	maven { url "https://maven.ryanliptak.com/" } // AppleSkin
	maven { url = "https://maven.shedaniel.me/" } // REI and deps

	maven { url 'https://www.cursemaven.com' }
	maven { url = "https://maven.parchmentmc.org" }
}

fabricApi {
	configureDataGeneration {
		modId = "rusticdelight"
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Fabric
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Parchment mappings
	mappings loom.layered() {
		it.officialMojangMappings {
			setNameSyntheticMembers(false)
		}
		it.parchment("org.parchmentmc.data:parchment-${project.parchment_version}")
	}

	// Farmer's Delight Refabricated (local patched jar — strips the 5 transitive-extend-enum lines
	// from farmersdelight.classtweaker, which still crash loom's remap with an NPE in
	// EnumExtensionClassVisitor. Re-checked against 3.3.3: the upstream issue is not fixed.)
	modImplementation(name: "farmers-delight-refabricated-${project.minecraft_version}-${project.farmersdelight_version}-patched") {
		exclude(group: "net.fabricmc")
	}

	// Cloth Config API
	modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// JEI API
	modCompileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}")
	modCompileOnly("mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}")

	// JEI
	modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}")

	// Appleskin
	modLocalRuntime("squeek.appleskin:appleskin-fabric:${appleskin_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}